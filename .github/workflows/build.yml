name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas de plataforma
        run: flutter create --platforms=linux --project-name grimorio35 --org br.grimorio .
      - run: flutter pub get
      - name: Analisar
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          echo "exit=$?" >> analyze.txt
      - name: Testes do motor de regras
        run: |
          set +e
          flutter test > test.txt 2>&1
          echo "exit=$?" >> test.txt
      - name: Publicar relatório (branch ci-logs)
        if: always()
        run: |
          mkdir -p /tmp/rep && cp analyze.txt test.txt /tmp/rep/ 2>/dev/null || true
          mkdir -p /tmp/clean && cd /tmp/clean && git init -q && cp /tmp/rep/* . && git add . && git -c user.name=ci -c user.email=ci@x commit -qm "test ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs-test
      - name: Resultado
        run: grep -q "^exit=0" analyze.txt && grep -q "^exit=0" test.txt

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas de plataforma
        run: flutter create --platforms=windows --project-name grimorio35 --org br.grimorio .
      - name: Ajustar título da janela
        shell: pwsh
        run: |
          $f = "windows/runner/main.cpp"
          (Get-Content $f) -replace 'L"grimorio35"', 'L"Grimorio 3.5"' | Set-Content $f
      - run: flutter pub get
      - name: Compilar
        shell: bash
        run: |
          set +e
          flutter build windows --release > build.txt 2>&1
          code=$?
          echo "exit=$code" >> build.txt
          tail -60 build.txt
          exit $code
      - name: Publicar relatório (branch ci-logs-windows)
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/clean && cp build.txt /tmp/clean/ 2>/dev/null || echo "sem log" > /tmp/clean/build.txt
          cd /tmp/clean && git init -q && git add . && git -c user.name=ci -c user.email=ci@x commit -qm "windows ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs-windows
      - name: Montar pacote portátil
        shell: pwsh
        run: |
          $out = "Grimorio35-windows-portable"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* $out
          # runtime do Visual C++ junto do .exe = roda sem instalar nada
          foreach ($dll in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "C:/Windows/System32/$dll" $out -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force "$out/data/characters","$out/data/homebrew" | Out-Null
          Set-Content "$out/data/LEIA-ME.txt" "Coloque aqui as partes rules.sqlite.gz.part1..3 (ou rules.sqlite). Fichas ficam em characters/, livros homebrew em homebrew/."
      - uses: actions/upload-artifact@v4
        with:
          name: Grimorio35-windows-portable
          path: Grimorio35-windows-portable

  linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Dependências GTK
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=linux --project-name grimorio35 --org br.grimorio .
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pacote portátil
        run: |
          mkdir -p Grimorio35-linux-portable
          cp -r build/linux/x64/release/bundle/* Grimorio35-linux-portable/
          mkdir -p Grimorio35-linux-portable/data/characters Grimorio35-linux-portable/data/homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: Grimorio35-linux-portable
          path: Grimorio35-linux-portable
