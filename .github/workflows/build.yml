name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas de plataforma
        run: flutter create --platforms=linux --project-name grimorio35 --org br.grimorio .
      - run: flutter pub get
      - name: Analisar
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes do motor de regras
        run: flutter test

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar pastas de plataforma
        run: flutter create --platforms=windows --project-name grimorio35 --org br.grimorio .
      - name: Ajustar título da janela
        shell: pwsh
        run: |
          $f = "windows/runner/main.cpp"
          (Get-Content $f) -replace 'L"grimorio35"', 'L"Grimorio 3.5"' | Set-Content $f
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Montar pacote portátil
        shell: pwsh
        run: |
          $out = "Grimorio35-windows-portable"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* $out
          # runtime do Visual C++ junto do .exe = roda sem instalar nada
          foreach ($dll in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "C:/Windows/System32/$dll" $out -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force "$out/data/characters","$out/data/homebrew" | Out-Null
          Set-Content "$out/data/LEIA-ME.txt" "Coloque aqui o arquivo rules.sqlite gerado pelo extrator. Fichas ficam em characters/, livros homebrew em homebrew/."
      - uses: actions/upload-artifact@v4
        with:
          name: Grimorio35-windows-portable
          path: Grimorio35-windows-portable

  linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Dependências GTK
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=linux --project-name grimorio35 --org br.grimorio .
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pacote portátil
        run: |
          mkdir -p Grimorio35-linux-portable
          cp -r build/linux/x64/release/bundle/* Grimorio35-linux-portable/
          mkdir -p Grimorio35-linux-portable/data/characters Grimorio35-linux-portable/data/homebrew
      - uses: actions/upload-artifact@v4
        with:
          name: Grimorio35-linux-portable
          path: Grimorio35-linux-portable
