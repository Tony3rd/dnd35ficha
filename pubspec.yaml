name: grimorio35
description: "Grimório 3.5 — gerenciador de fichas de D&D 3.5 portátil."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  xml: ^6.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  printing: ^5.13.2
  file_picker: ^8.1.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/srd/
    - assets/fonts/
